name: DeskEyeRest
options:
  bundleIdPrefix: app.deskeyerest
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"        # ad-hoc signing for local development builds
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: NO

targets:
  DeskEyeRest:
    type: application
    platform: macOS
    sources:
      - path: DeskEyeRest
        excludes:
          - "**/*.md"
    resources:
      - path: DeskEyeRest/Resources/Fonts
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.deskeyerest.DeskEyeRest
        INFOPLIST_FILE: DeskEyeRest/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_STRICT_CONCURRENCY: complete
    scheme:
      testTargets:
        - DeskEyeRestTests

  DeskEyeRestTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - DeskEyeRestTests
    dependencies:
      - target: DeskEyeRest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.deskeyerest.DeskEyeRestTests
        GENERATE_INFOPLIST_FILE: YES

